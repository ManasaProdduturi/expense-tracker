<!DOCTYPE html>
<html>
<head>
    <title>Expenses - Expense Tracker</title>
</head>
<body>

    <h1>My Expenses</h1>

    <form method="GET" action="{{ url_for('expenses') }}">

    <input
        type="text"
        name="search"
        placeholder="Search description..."
        value="{{ search }}"
    >

    <button type="submit">Search</button>

    <select name="category">
        <option value="">All Categories</option>
        
        {% for category in categories %}
            <option
                value="{{ category['id'] }}"
                {% if category['id']|string == selected_category %}
                selected
                {% endif %}
            >
                {{ category['name'] }}
            </option>
        {% endfor %}
    </select>

    </form>

    <a href="{{ url_for('add_expense') }}">Add Expense</a>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>Amount</th>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for expense in expenses %}
                <tr>
                    <td>₹{{ expense["amount"] }}</td>
                    <td>{{ expense["date"] }}</td>
                    <td>{{ expense["category_name"] }}</td>
                    <td>{{ expense["description"] }}</td>
                    <td>
                        <a href="{{ url_for('edit_expense', expense_id=expense['id']) }}">
                            Edit
                        </a>

                        <a
                            href="{{ url_for('delete_expense', expense_id=expense['id']) }}"
                            onclick="return confirm('Are you sure you want to delete this expense?');"
                        >
                            Delete
                        </a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
