<!DOCTYPE html>
<html>
<head>
    <title>Expenses - Expense Tracker</title>
</head>
<body>

    <h1>My Expenses</h1>

    <a href="{{ url_for('add_expense') }}">Add Expense</a>

    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>Amount</th>
                <th>Date</th>
                <th>Category</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            {% for expense in expenses %}
                <tr>
                    <td>₹{{ expense["amount"] }}</td>
                    <td>{{ expense["date"] }}</td>
                    <td>{{ expense["category_name"] }}</td>
                    <td>{{ expense["description"] }}</td>
                    <td>
                        <a href="{{ url_for('edit_expense', expense_id=expense['id']) }}">
                            Edit
                        </a>

                        <a href="{{ url_for('delete_expense', expense_id=expense['id']) }}">
                            Delete
                        </a>
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
