<!DOCTYPE html>
<html>
<head>
    <title>Edit Expense - Expense Tracker</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }

        .expense-card {
            max-width: 600px;
            margin: 0 auto;
            border: none;
            border-radius: 12px;
        }

        .page-title {
            font-weight: 600;
        }

        .form-label {
            font-weight: 500;
        }
    </style>
</head>

<body>

<div class="container py-4">

    <!-- Header -->

    <div class="d-flex align-items-center mb-4">

        <a
            href="{{ url_for('expenses') }}"
            class="btn btn-outline-secondary me-3"
            data-bs-toggle="tooltip"
            data-bs-title="Back to Expenses"
        >
            ←
        </a>

        <div>
            <h1 class="page-title mb-1">
                Edit Expense
            </h1>

            <p class="text-muted mb-0">
                Update your expense details.
            </p>
        </div>

    </div>


    <!-- Form -->

    <div class="card expense-card shadow-sm">

        <div class="card-body p-4">

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
            <span class="me-2">⚠️</span>
            <div>
                {{ error }}
            </div>
        </div>
        {% endif %}

        <form method="POST">

                <!-- Amount -->

                <div class="mb-3">

                    <label
                        for="amount"
                        class="form-label"
                    >
                        Amount
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            {{ currency_symbol }}
                        </span>

                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            class="form-control"
                            step="0.01"
                            min="0.01"
                            value="{{ expense['amount'] }}"
                            required
                        >

                    </div>

                </div>


                <!-- Date -->

                <div class="mb-3">

                    <label
                        for="date"
                        class="form-label"
                    >
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        class="form-control"
                        value="{{ expense['date'] }}"
                        max="{{ today }}"
                        required
                    >

                </div>


                <!-- Category -->

                <div class="mb-3">

                    <label
                        for="category_id"
                        class="form-label"
                    >
                        Category
                    </label>

                    <select
                        id="category_id"
                        name="category_id"
                        class="form-select"
                        required
                    >

                        {% for category in categories %}

                            <option
                                value="{{ category['id'] }}"
                                {% if category['id'] == expense['category_id'] %}
                                    selected
                                {% endif %}
                            >
                                {{ category['name'] }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Description -->

                <div class="mb-4">

                    <label
                        for="description"
                        class="form-label"
                    >
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        name="description"
                        class="form-control"
                        value="{{ expense['description'] or '' }}"
                        placeholder="Optional description"
                    >

                </div>


                <!-- Buttons -->

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>

                    <a
                        href="{{ url_for('expenses') }}"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- Tooltips -->

<script>

    const tooltipTriggerList =
        document.querySelectorAll(
            '[data-bs-toggle="tooltip"]'
        );

    [...tooltipTriggerList].map(
        tooltipTriggerEl =>
            new bootstrap.Tooltip(tooltipTriggerEl)
    );

</script>

{% include "footer.html" %}

</body>
</html>
