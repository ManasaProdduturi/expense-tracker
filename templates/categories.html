<!DOCTYPE html>
<html>
<head>
    <title>Categories - Expense Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }

        .categories-card {
            max-width: 600px;
            margin: 0 auto;
            border: none;
            border-radius: 12px;
        }

        .page-title {
            font-weight: 600;
        }

        .category-item {
            padding: 12px 16px;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            margin-bottom: 8px;
            background-color: #fff;
        }

        .category-number {
            font-weight: 600;
            color: #6c757d;
            min-width: 30px;
            display: inline-block;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="card categories-card shadow-sm">

        <div class="card-body p-4">

            <div class="text-center mb-4">
                <h1 class="page-title mb-2">
                    Categories
                </h1>

                <p class="text-muted mb-0">
                    These are the categories you can choose when adding or editing an expense.
                    While adding the expense select the category that best describes where your money went.
                </p>
            </div>

            <div>
                {% for category in categories %}
                    <div class="category-item">
                        <span class="category-number">
                            {{ loop.index }}.
                        </span>

                        {{ category["name"] }}
                    </div>
                {% endfor %}
            </div>

        </div>

    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

{% include "footer.html" %}
</body>
</html>
