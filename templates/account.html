{% extends "layout.html" %}

{% block title %}Account{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="text-center mb-4">Account</h2>

                    {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input
                            type="text"
                            class="form-control"
                            value="{{ user['username'] }}"
                            readonly
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            value="{{ user['email'] }}"
                            readonly
                        >
                    </div>

                    <hr>

                    <h4 class="mb-3">Change Password</h4>

                    <form
                        action="{{ url_for('change_password') }}"
                        method="post"
                    >
                        <div class="mb-3">
                            <label
                                for="current_password"
                                class="form-label"
                            >
                                Current Password
                            </label>

                            <input
                                type="password"
                                id="current_password"
                                name="current_password"
                                class="form-control"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label
                                for="new_password"
                                class="form-label"
                            >
                                New Password
                            </label>

                            <input
                                type="password"
                                id="new_password"
                                name="new_password"
                                class="form-control"
                                minlength="8"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label
                                for="confirm_password"
                                class="form-label"
                            >
                                Confirm New Password
                            </label>

                            <input
                                type="password"
                                id="confirm_password"
                                name="confirm_password"
                                class="form-control"
                                minlength="8"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Change Password
                        </button>
                    </form>

                        <hr class="my-4">

                        <h4 class="text-danger mb-3">Delete Account</h4>

                        <p class="text-muted">
                            Deleting your account will permanently remove your
                            expenses and account data.
                        </p>

                    <form
                        action="{{ url_for('delete_account_request') }}"
                        method="post"
                    >
                        <button type="submit" class="btn btn-outline-danger w-100">
                            Delete Account
                        </button>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
