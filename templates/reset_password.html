{% extends "layout.html" %}

{% block title %}Reset Password - Expense Tracker{% endblock %}

{% block content %}
<div class="container py-5 reset-password-page">
    <div class="card reset-card shadow-sm">
        <div class="card-body p-4">

            {% if error %}
                <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                    <span class="me-2">⚠️</span>
                    <div>{{ error }}</div>
                </div>
            {% endif %}

            <div class="text-center mb-4">
                <h1 class="page-title mb-2">Reset Password</h1>
                <p class="text-muted mb-0">
                    Create a new password for your account.
                </p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="password" class="form-label">New Password</label>

                    <div class="password-group">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-password-toggle="password"
                            aria-label="Show password"
                        >👁️</button>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label">
                        Confirm New Password
                    </label>

                    <div class="password-group">
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            class="form-control"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-password-toggle="confirm_password"
                            aria-label="Show password"
                        >👁️</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary reset-button">
                    Reset Password
                </button>
            </form>

        </div>
    </div>
</div>
{% endblock %}
