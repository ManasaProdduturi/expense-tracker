<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Reset Password - Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }

        .reset-card {
            max-width: 450px;
            margin: 0 auto;
            border: none;
            border-radius: 12px;
        }

        .page-title {
            font-weight: 600;
        }

        .form-label {
            font-weight: 500;
        }

        .password-group {
            position: relative;
        }

        .password-group input {
            padding-right: 45px;
        }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        .reset-button {
            width: 100%;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="card reset-card shadow-sm">

        <div class="card-body p-4">

            {% if error %}

                <div
                    class="alert alert-danger d-flex align-items-center mb-4"
                    role="alert"
                >

                    <span class="me-2">⚠️</span>

                    <div>
                        {{ error }}
                    </div>

                </div>

            {% endif %}


            <div class="text-center mb-4">

                <h1 class="page-title mb-2">
                    Reset Password
                </h1>

                <p class="text-muted mb-0">
                    Create a new password for your account.
                </p>

            </div>


            <form method="POST">

                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label"
                    >
                        New Password
                    </label>

                    <div class="password-group">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('password', this)"
                            aria-label="Show password"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <div class="mb-4">

                    <label
                        for="confirm_password"
                        class="form-label"
                    >
                        Confirm New Password
                    </label>

                    <div class="password-group">

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            class="form-control"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword('confirm_password', this)"
                            aria-label="Show password"
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary reset-button"
                >
                    Reset Password
                </button>

            </form>

        </div>

    </div>

</div>


<script>

function togglePassword(inputId, button) {

    const input = document.getElementById(inputId);

    if (input.type === "password") {

        input.type = "text";
        button.textContent = "🙈";
        button.setAttribute("aria-label", "Hide password");

    } else {

        input.type = "password";
        button.textContent = "👁️";
        button.setAttribute("aria-label", "Show password");

    }

}

</script>

</body>

</html>
