{% extends "layout.html" %}

{% block title %}Verify OTP - Expense Tracker{% endblock %}

{% block content %}

<div class="container py-5 verify-otp-page">

    <div class="card otp-card shadow-sm">

        <div class="card-body p-4">

            {% if error %}
                <div
                    class="alert alert-danger d-flex align-items-center mb-4"
                    role="alert"
                >
                    <span class="me-2">⚠️</span>
                    <div>{{ error }}</div>
                </div>
            {% endif %}

            <div class="text-center mb-4">

                <h1 class="page-title mb-2">
                    Verify OTP
                </h1>

                <p class="text-muted mb-0">
                    Enter the 6-digit OTP sent to your email.
                </p>

            </div>

            <form
                method="POST"
                action="{{ url_for('verify_otp', email=email) }}"
            >

                <div class="mb-4">

                    <label for="otp" class="form-label">
                        Enter OTP
                    </label>

                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        class="form-control otp-input"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        autocomplete="one-time-code"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-success verify-button"
                >
                    Verify OTP
                </button>

            </form>

            <div class="text-center mt-4">
                <a href="{{ url_for('forgot_password') }}">
                    Request a new OTP
                </a>
            </div>

        </div>

    </div>

</div>

{% endblock %}
