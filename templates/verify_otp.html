<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Verify OTP - Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }

        .otp-card {
            max-width: 450px;
            margin: 0 auto;
            border: none;
            border-radius: 12px;
        }

        .page-title {
            font-weight: 600;
        }

        .form-label {
            font-weight: 500;
        }

        .verify-button {
            width: 100%;
        }

        .otp-input {
            text-align: center;
            font-size: 24px;
            letter-spacing: 8px;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="card otp-card shadow-sm">

        <div class="card-body p-4">

            {% if error %}

                <div
                    class="alert alert-danger d-flex align-items-center mb-4"
                    role="alert"
                >

                    <span class="me-2">⚠️</span>

                    <div>
                        {{ error }}
                    </div>

                </div>

            {% endif %}


            <div class="text-center mb-4">

                <h1 class="page-title mb-2">
                    Verify OTP
                </h1>

                <p class="text-muted mb-0">
                    Enter the 6-digit OTP sent to your email.
                </p>

            </div>


            <form
                method="POST"
                action="{{ url_for('verify_otp', email=email) }}"
            >

                <div class="mb-4">

                    <label
                        for="otp"
                        class="form-label"
                    >
                        Enter OTP
                    </label>

                    <input
                        type="text"
                        id="otp"
                        name="otp"
                        class="form-control otp-input"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        autocomplete="one-time-code"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-success verify-button"
                >
                    Verify OTP
                </button>

            </form>


            <div class="text-center mt-4">

                <a href="{{ url_for('forgot_password') }}">
                    Request a new OTP
                </a>

            </div>

        </div>

    </div>

</div>

</body>

</html>
