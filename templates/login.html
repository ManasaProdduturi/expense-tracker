<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Login - Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .login-card {
            max-width: 450px;
            margin: 0 auto;
            border: none;
            border-radius: 12px;
        }

        .page-title {
            font-weight: 600;
        }

        .form-label {
            font-weight: 500;
        }

        .login-button {
            width: 100%;
        }
    </style>
</head>

<body>

<div class="container py-5 login-page">

    <div class="card login-card shadow-sm">

        <div class="card-body p-4">

            {% if error %}

                <div
                    class="alert alert-danger d-flex align-items-center mb-4"
                    role="alert"
                >

                    <span class="me-2">⚠️</span>

                    <div>
                        {{ error }}
                    </div>

                </div>

            {% endif %}


            <div class="text-center mb-4">

                <h1 class="page-title mb-2">
                    Login
                </h1>

                <p class="text-muted mb-0">
                    Welcome back! Log in to manage your expenses.
                </p>

            </div>


            <form method="POST">

                <!-- Username -->

                <div class="mb-3">

                    <label
                        for="username_or_email"
                        class="form-label"
                    >
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="username_or_email"
                        name="username_or_email"
                        class="form-control"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>

                    <div class="input-group">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="togglePassword"
                            aria-label="Show password"
                            title="Show password"
                        >👁️</button>
                    </div>
                </div>


                <!-- Login -->

                <button
                    type="submit"
                    class="btn btn-primary login-button"
                >
                    Login
                </button>

            </form>


            <!-- Forgot Password -->

            <div class="text-center mt-3">

                <a href="{{ url_for('forgot_password') }}">
                    Forgot Password?
                </a>

            </div>


            <!-- Register -->

            <div class="text-center mt-3">

                <p class="text-muted mb-0">

                    Don't have an account?

                    <a href="{{ url_for('register') }}">
                        Register
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script>
const password = document.getElementById("password");
const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", function () {
    const showing = password.type === "password";

    password.type = showing ? "text" : "password";
    this.textContent = showing ? "🙈" : "👁️";
    this.setAttribute("aria-label", showing ? "Hide password" : "Show password");
    this.setAttribute("title", showing ? "Hide password" : "Show password");
});
</script>


{% include "footer.html" %}
</body>

</html>
