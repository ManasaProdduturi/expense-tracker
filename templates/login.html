{% extends "layout.html" %}

{% block title %}Login - Expense Tracker{% endblock %}

{% block content %}

<div class="container py-5 login-page">
    <div class="card login-card shadow-sm">
        <div class="card-body p-4">

            {% if error %}
                <div
                    class="alert alert-danger d-flex align-items-center mb-4"
                    role="alert"
                >
                    <span class="me-2">⚠️</span>
                    <div>{{ error }}</div>
                </div>
            {% endif %}

            <div class="text-center mb-4">
                <h1 class="page-title mb-2">Login</h1>
                <p class="text-muted mb-0">
                    Welcome back! Log in to manage your expenses.
                </p>
            </div>

            <form method="POST">
                <div class="mb-3">
                    <label for="username_or_email" class="form-label">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="username_or_email"
                        name="username_or_email"
                        class="form-control"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="input-group">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="togglePassword"
                            aria-label="Show password"
                            title="Show password"
                        >👁️</button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="btn btn-primary login-button"
                >
                    Login
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="{{ url_for('forgot_password') }}">
                    Forgot Password?
                </a>
            </div>

            <div class="text-center mt-3">
                <p class="text-muted mb-0">
                    Don't have an account?
                    <a href="{{ url_for('register') }}">Register</a>
                </p>
            </div>

        </div>
    </div>
</div>

{% endblock %}
