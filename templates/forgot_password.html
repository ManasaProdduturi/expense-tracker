{% extends "layout.html" %}

{% block title %}Forgot Password - Expense Tracker{% endblock %}

{% block content %}

<div class="container py-5 forgot-password-page">

    <div class="card forgot-card shadow-sm">

        <div class="card-body p-4">

            {% if error %}
                <div
                    class="alert alert-danger"
                    role="alert"
                >
                    ⚠️ {{ error }}
                </div>
            {% endif %}

            <div class="text-center mb-4">

                <h1 class="page-title mb-2">
                    Forgot Password
                </h1>

                <p class="text-muted mb-0">
                    Enter your registered email address.
                </p>

            </div>

            <form method="POST">

                <div class="mb-4">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        autocomplete="email"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-success submit-button"
                >
                    Send OTP
                </button>

            </form>

            <div class="text-center mt-4">

                <a href="{{ url_for('login') }}">
                    Back to Login
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
