<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Forgot Password - Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }

        .forgot-card {
            max-width: 450px;
            margin: 0 auto;
            border: none;
            border-radius: 12px;
        }

        .page-title {
            font-weight: 600;
        }

        .form-label {
            font-weight: 500;
        }

        .submit-button {
            width: 100%;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="card forgot-card shadow-sm">

        <div class="card-body p-4">

            {% if error %}

                <div
                    class="alert alert-danger"
                    role="alert"
                >
                    ⚠️ {{ error }}
                </div>

            {% endif %}

            <div class="text-center mb-4">

                <h1 class="page-title mb-2">
                    Forgot Password
                </h1>

                <p class="text-muted mb-0">
                    Enter your registered email address.
                </p>

            </div>

            <form method="POST">

                <div class="mb-4">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        autocomplete="email"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-success submit-button"
                >
                    Send OTP
                </button>

            </form>

            <div class="text-center mt-4">

                <a href="{{ url_for('login') }}">
                    Back to Login
                </a>

            </div>

        </div>

    </div>

</div>

{% include "footer.html" %}

</body>

</html>
