<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Add Expense - Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: 600;
        }

        .expense-card {
            max-width: 600px;
            margin: 0 auto;
            border: none;
            border-radius: 12px;
        }

        .page-title {
            font-weight: 600;
        }

        .form-label {
            font-weight: 500;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-light bg-white shadow-sm">

    <div class="container">

        <a
            class="navbar-brand"
            href="{{ url_for('home') }}"
        >
            Expense Tracker
        </a>

        <div class="dropdown">

            <button
                class="btn btn-outline-secondary"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
                title="Open menu"
            >
                ☰
            </button>

            <ul class="dropdown-menu dropdown-menu-end">

                <li>
                    <a
                        class="dropdown-item"
                        href="{{ url_for('home') }}"
                    >
                        🏠 Home
                    </a>
                </li>

                <li>
                    <a
                        class="dropdown-item"
                        href="{{ url_for('dashboard') }}"
                    >
                        📊 Dashboard
                    </a>
                </li>

                <li>
                    <a
                        class="dropdown-item"
                        href="{{ url_for('expenses') }}"
                    >
                        💰 Expenses
                    </a>
                </li>

                <li>
                    <a
                        class="dropdown-item"
                        href="{{ url_for('add_expense') }}"
                    >
                        ➕ Add Expense
                    </a>
                </li>

                <li>
                    <a
                        class="dropdown-item"
                        href="{{ url_for('categories') }}"
                    >
                        📂 Categories
                    </a>
                </li>

                <li>
                    <hr class="dropdown-divider">
                </li>

                <li>
                    <a
                        class="dropdown-item text-danger"
                        href="{{ url_for('logout') }}"
                    >
                        🚪 Logout
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container py-5">

    <div class="card expense-card shadow-sm">

        <div class="card-body p-4">

            <div class="text-center mb-4">

                <h1 class="page-title mb-2">
                    Add Expense
                </h1>

                <p class="text-muted mb-0">
                    Record a new expense.
                </p>

            </div>

            {% if error %}

                <div
                    class="alert alert-danger d-flex align-items-center mb-4"
                    role="alert"
                >

                    <span class="me-2">
                        ⚠️
                    </span>

                    <div>
                        {{ error }}
                    </div>

                </div>

            {% endif %}

            <form method="POST">

                <div class="mb-3">

                    <label
                        for="amount"
                        class="form-label"
                    >
                        Amount
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            {{ currency_symbol }}
                        </span>

                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            class="form-control"
                            min="0.01"
                            step="0.01"
                            value="{{ request.form.get('amount', '') }}"
                            required
                        >

                    </div>

                </div>

                <div class="mb-3">

                    <label
                        for="date"
                        class="form-label"
                    >
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        class="form-control"
                        max="{{ today }}"
                        value="{{ request.form.get('date', today) }}"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label
                        for="category_id"
                        class="form-label"
                    >
                        Category
                    </label>

                    <select
                        id="category_id"
                        name="category_id"
                        class="form-select"
                        required
                    >

                        <option
                            value=""
                            selected
                            disabled
                        >
                            Select Category
                        </option>

                        {% for category in categories %}

                            <option
                                value="{{ category['id'] }}"
                                {% if request.form.get('category_id') == category['id']|string %}
                                    selected
                                {% endif %}
                            >
                                {{ category['name'] }}
                            </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-4">

                    <label
                        for="description"
                        class="form-label"
                    >
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        name="description"
                        class="form-control"
                        maxlength="200"
                        value="{{ request.form.get('description', '') }}"
                        placeholder="Optional"
                    >

                </div>

                <div
                    class="d-flex justify-content-between align-items-center"
                >

                    <a
                        href="{{ url_for('expenses') }}"
                        class="btn btn-outline-secondary"
                    >
                        Cancel
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary"
                        data-bs-toggle="tooltip"
                        data-bs-title="Save this expense"
                    >
                        Add Expense
                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script>

    const tooltipTriggerList =
        document.querySelectorAll(
            '[data-bs-toggle="tooltip"]'
        );

    [...tooltipTriggerList].map(
        tooltipTriggerEl =>
            new bootstrap.Tooltip(tooltipTriggerEl)
    );

</script>

{% include "footer.html" %}
</body>

</html>
