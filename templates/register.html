<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Register - Expense Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }

        .register-card {
            max-width: 450px;
            margin: 0 auto;
            border: none;
            border-radius: 12px;
        }

        .page-title {
            font-weight: 600;
        }

        .form-label {
            font-weight: 500;
        }

        .register-button {
            width: 100%;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="card register-card shadow-sm">

        <div class="card-body p-4">

            {% if error %}
                <div
                    class="alert alert-danger d-flex align-items-center mb-4"
                    role="alert"
                >
                    <span class="me-2">⚠️</span>

                    <div>
                        {{ error }}
                    </div>
                </div>
            {% endif %}

            <div class="text-center mb-4">

                <h1 class="page-title mb-2">
                    Create Account
                </h1>

                <p class="text-muted mb-0">
                    Register to start tracking your expenses.
                </p>

            </div>

            <form method="POST">

                <div class="mb-3">

                    <label
                        for="username"
                        class="form-label"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <div class="mb-4">

                    <label
                        for="confirm_password"
                        class="form-label"
                    >
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-control"
                        autocomplete="new-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="btn btn-success register-button"
                >
                    Register
                </button>

            </form>

            <div class="text-center mt-4">

                <p class="text-muted mb-0">
                    Already have an account?
                    <a href="{{ url_for('login') }}">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>

</html>
