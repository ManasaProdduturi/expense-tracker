{% extends "layout.html" %}

{% block title %}Register - Expense Tracker{% endblock %}

{% block content %}

<div class="container py-5 register-page">
    <div class="card register-card shadow-sm">
        <div class="card-body p-4">

            {% if error %}
                <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                    <span class="me-2">⚠️</span>
                    <div>{{ error }}</div>
                </div>
            {% endif %}

            <div class="text-center mb-4">
                <h1 class="page-title mb-2">Create Account</h1>
                <p class="text-muted mb-0">
                    Register to start tracking your expenses.
                </p>
            </div>

            <form method="POST" id="registerForm">

                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        value="{{ username or '' }}"
                        autocomplete="username"
                        pattern="[A-Za-z0-9_]+"
                        title="Username can contain only letters, numbers, and underscores."
                        minlength="3"
                        maxlength="30"
                        required
                    >
                    <div id="usernameStatus" class="form-text"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        value="{{ email or '' }}"
                        autocomplete="email"
                        required
                    >
                    <div id="emailStatus" class="form-text"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            autocomplete="new-password"
                            required
                        >
                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="togglePassword"
                            aria-label="Show password"
                            title="Show password"
                        >👁️</button>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <div class="input-group">
                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            class="form-control"
                            autocomplete="new-password"
                            required
                        >
                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="toggleConfirmPassword"
                            aria-label="Show password"
                            title="Show password"
                        >👁️</button>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="currency" class="form-label">Preferred Currency</label>
                    <select class="form-select" id="currency" name="currency" required>
                        <option value="INR" selected>INR (₹) — Indian Rupee</option>
                        <option value="USD">USD ($) — US Dollar</option>
                        <option value="GBP">GBP (£) — British Pound</option>
                        <option value="EUR">EUR (€) — Euro</option>
                        <option value="JPY">JPY (¥) — Japanese Yen</option>
                        <option value="KRW">KRW (₩) — South Korean Won</option>
                        <option value="AUD">AUD ($) — Australian Dollar</option>
                        <option value="CAD">CAD ($) — Canadian Dollar</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-success register-button">
                    Register
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-muted mb-0">
                    Already have an account?
                    <a href="{{ url_for('login') }}">Login</a>
                </p>
            </div>

        </div>
    </div>
</div>

{% endblock %}
