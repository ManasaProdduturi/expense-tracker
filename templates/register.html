<!DOCTYPE html>
<html>
<head>
    <title>Register - Expense Tracker</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }

        .register-card {
            max-width: 450px;
            margin: 0 auto;
            border: none;
            border-radius: 12px;
        }

        .page-title {
            font-weight: 600;
        }
    </style>
</head> 

<body>

<div class="container py-5">

    <div class="card register-card shadow-sm">

        <div class="card-body p-4">
            {% if error %}
            <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                <span class="me-2">⚠️</span>
                <div>
                    <strong>Account already exists</strong><br>
                    {{ error }}
                </div>
            </div>
            {% endif %}

            <div class="text-center mb-4">

                <h1 class="page-title mb-2">
                    Create an Account
                </h1>

                <p class="text-muted mb-0">
                    Start tracking your expenses today.
                </p>

            </div>


            <form method="POST">

                <!-- Username -->

                <div class="mb-3">

                    <label
                        for="username"
                        class="form-label fw-semibold"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="mb-3">

                    <label
                        for="email"
                        class="form-label fw-semibold"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="mb-3">

                    <label
                        for="password"
                        class="form-label fw-semibold"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Confirm Password -->

                <div class="mb-4">

                    <label
                        for="confirm_password"
                        class="form-label fw-semibold"
                    >
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        class="form-control"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Register -->

                <button
                    type="submit"
                    class="btn btn-success w-100"
                >
                    Register
                </button>

                {% if error %}
                <div class="alert alert-danger d-flex align-items-center" role="alert">
                    <span class="me-2">⚠️</span>
                    <div>
                        <strong>Account already exists</strong><br>
                        {{ error }}
                    </div>
                </div>
                {% endif %}

            </form>


            <div class="text-center mt-4">

                <span class="text-muted">
                    Already have an account?
                </span>

                <a
                    href="{{ url_for('login') }}"
                    class="text-decoration-none"
                >
                    Login
                </a>

            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>
</html>
