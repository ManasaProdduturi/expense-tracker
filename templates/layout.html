<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {% block title %}Expense Tracker{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

```html
<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('home') }}">
            Expense Tracker
        </a>

        <div class="dropdown">
            <button
                class="btn btn-outline-secondary"
                type="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
                title="Open menu"
            >
                ☰
            </button>

            <ul class="dropdown-menu dropdown-menu-end">
                <li>
                    <a class="dropdown-item" href="{{ url_for('home') }}">🏠 Home</a>
                </li>
                <li>
                    <a class="dropdown-item" href="{{ url_for('dashboard') }}">📊 Dashboard</a>
                </li>
                <li>
                    <a class="dropdown-item" href="{{ url_for('expenses') }}">💰 Expenses</a>
                </li>
                <li>
                    <a class="dropdown-item" href="{{ url_for('add_expense') }}">➕ Add Expense</a>
                </li>
                <li>
                    <a class="dropdown-item" href="{{ url_for('categories') }}">📂 Categories</a>
                </li>
                {% if session.get("user_id") %}
                <li>
                    <a class="dropdown-item" href="{{ url_for('account') }}">👤 Profile</a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item text-danger" href="{{ url_for('logout') }}">🚪 Logout</a>
                </li>
                {% else %}
                <li><hr class="dropdown-divider"></li>
                <li>
                    <a class="dropdown-item" href="{{ url_for('login') }}">Login</a>
                </li>
                <li>
                    <a class="dropdown-item" href="{{ url_for('register') }}">Register</a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
```

<main>
    {% block content %}{% endblock %}
</main>

{% include "footer.html" %}

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script
    src="{{ url_for('static', filename='js/script.js') }}"
></script>

</body>
</html>
